<style>
  @page { size: A4; margin: 10mm; }

  /* ── Barre de réglages (écran uniquement) ── */
  .coupon-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .coupon-bar h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 .2rem; }
  .cb-controls { display: flex; gap: .75rem; align-items: flex-end; flex-wrap: wrap; }
  .cb-controls label { display: flex; flex-direction: column; gap: .2rem; font-size: .8rem; font-weight: 600; margin: 0; }
  .cb-controls select { border: 1.5px solid #9aa1ac; border-radius: 8px; padding: .4rem .6rem; background: #fff; }
  .cb-controls .cb-check { flex-direction: row; align-items: center; gap: .4rem; padding-bottom: .5rem; }
  .cb-tip { font-size: .85rem; color: #4b5563; margin: 0 0 1rem; }

  /* ── Feuille A4 simulée à l'écran ── */
  .coupon-sheet { width: 210mm; max-width: 100%; margin: 0 auto; padding: 10mm; background: #fff;
                  border: 1px solid #cfd4dc; box-shadow: 0 8px 24px rgba(10,10,10,.1); box-sizing: border-box; }
  #coupons { display: grid; gap: 4mm; font-size: var(--fs, 9pt); }
  #coupons.l6 { grid-template-columns: 1fr 1fr; --ch: 86mm; }
  #coupons.l4 { grid-template-columns: 1fr 1fr; --ch: 132mm; }
  #coupons.l2 { grid-template-columns: 1fr;      --ch: 132mm; }

  /* ── Un coupon ── */
  .coupon, .coupon * { box-sizing: border-box; }
  .coupon { min-height: var(--ch, 132mm); border: 1px dashed #6b7280; border-radius: 2mm; padding: 3.5mm 4mm;
            display: flex; flex-direction: column; gap: 2mm; background: #fff; color: #111;
            break-inside: avoid; page-break-inside: avoid; }
  .coupon p { color: inherit; margin: 0 0 .8mm; }
  .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 3mm;
            border-bottom: 1.2px solid #111; padding-bottom: 1.8mm; }
  .c-name { font-size: 1.25em; font-weight: 800; line-height: 1.15; }
  .c-meta { font-size: .85em; color: #4b5563; margin-top: .6mm; }
  .c-total { white-space: nowrap; text-align: right; line-height: 1; }
  .c-total strong { font-size: 2em; font-weight: 800; }
  .c-total span { font-size: 1em; color: #4b5563; margin-left: 1mm; }

  .c-grades { width: 100%; border-collapse: collapse; }
  .c-grades th, .c-grades td { padding: .7mm 0; vertical-align: top; text-align: left; font-weight: 400; }
  .c-grades th { width: 7mm; font-weight: 700; color: #4b5563; }
  .c-grades .c-pts { text-align: right; white-space: nowrap; font-weight: 700; padding-left: 2mm; }
  .c-advice { font-size: .85em; color: #4b5563; font-style: italic; }
  .hide-advice .c-advice { display: none; }

  .c-text { flex: 1; line-height: 1.35; border-top: .5px solid #c4c9d1; padding-top: 1.8mm; }
  .c-text section { display: block; margin: 0 0 1.2mm; }
  .c-text .section-label { font-weight: 700; font-size: .88em; color: #374151; }

  .c-foot { display: flex; align-items: center; gap: 3mm; border-top: .5px solid #c4c9d1; padding-top: 1.8mm; }
  .c-qr { width: 24mm; height: 24mm; flex-shrink: 0;}
  .c-qrtext { font-size: .85em; line-height: 1.3; min-width: 0; }
  .c-qrtext strong { display: block; }
  .c-qrtext span { color: #4b5563; word-break: break-all; font-size: .8em; }

  @media print {
    .vox-navbar, .vox-breadcrumb-bar, .vox-footer, .no-print, .alert { display: none !important; }
    body { background: #fff !important; }
    main.container { padding: 0 !important; max-width: none !important; }
    .coupon-sheet { width: auto; max-width: none; margin: 0; padding: 0; border: 0; box-shadow: none; }
  }
</style>
