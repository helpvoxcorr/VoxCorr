{% extends "base.html" %}
{% block title %}Modifier {{ assignment.title }} — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-10">
    <div class="vox-card">
      <h2 class="h4 mb-4">Modifier le devoir</h2>
      
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="vox-label">Titre *</label>
            <input type="text" name="title" class="vox-input" value="{{ assignment.title }}" required>
          </div>
          <div class="col-md-3">
            <label class="vox-label">Date</label>
            <input type="date" name="date" class="vox-input" value="{{ assignment.date.strftime('%Y-%m-%d') if assignment.date else '' }}">
          </div>
          <div class="col-md-3">
            <label class="vox-label">Total points *</label>
            <input type="number" name="total_points" class="vox-input" value="{{ assignment.total_points }}" step="0.5" required>
          </div>
        </div>

        <hr class="my-4">
        <h3 class="h5 mb-3">Questions existantes</h3>
        
        {% for item in questions_data %}
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-center">
              <div class="col-md-1 text-center fw-bold">Q{{ loop.index }}</div>
              <div class="col-md-5">
                <input type="text" name="q_label_{{ item.question.id }}" class="form-control" value="{{ item.question.label }}" required>
              </div>
              <div class="col-md-2">
                <input type="number" name="q_max_{{ item.question.id }}" class="form-control" value="{{ item.question.max_points }}" step="0.5" required>
              </div>
              <div class="col-md-3">
                <select name="q_competence_id_{{ item.question.id }}" class="form-select">
                  <option value="">-- Compétence --</option>
                  {% for subject, comps in competences_by_domain.items() %}
                    <optgroup label="{{ subject }}">
                      {% for c in comps %}
                        <option value="{{ c.id }}" {% if item.question.competence_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                      {% endfor %}
                    </optgroup>
                  {% endfor %}
                </select>
              </div>
            </div>
            {% if item.corrections_count > 0 %}
            <div class="form-check mt-2">
              <input class="form-check-input" type="checkbox" name="q_clamp_{{ item.question.id }}" value="1" id="clamp_{{ item.question.id }}">
              <label class="form-check-label small text-muted" for="clamp_{{ item.question.id }}">
                Recalibrer les notes existantes si le barème change ({{ item.corrections_count }} corrections impactées)
              </label>
            </div>
            {% endif %}
          </div>
        </div>
        {% endfor %}

        <div class="d-flex justify-content-between mt-4">
          <a href="{{ url_for('teacher_crud.class_detail', class_id=assignment.classroom_id) }}" class="btn vox-btn-outline">Annuler</a>
          <button type="submit" class="btn vox-btn-primary">Enregistrer les modifications</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
