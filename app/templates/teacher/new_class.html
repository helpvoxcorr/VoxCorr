{% extends "base.html" %}
{% block title %}Nouvelle classe — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="vox-card">
      <h2 class="h4 mb-1">Nouvelle classe</h2>
      <p class="text-muted small mb-4">Vous ajouterez les élèves ensuite, un par un ou depuis un fichier CSV.</p>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="name" class="vox-label">Nom de la classe *</label>
          <input type="text" class="vox-input" id="name" name="name" required autofocus placeholder="Ex : 6e3">
        </div>

        <div class="mb-3">
          <label for="level" class="vox-label">Niveau</label>
          <select class="vox-input" id="level" name="level">
            <option value="">— Non renseigné —</option>
            {% for lvl in levels %}<option value="{{ lvl }}">{{ lvl }}</option>{% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="subject" class="vox-label">Matière <span class="text-muted fw-normal">(facultatif)</span></label>
          <input type="text" class="vox-input" id="subject" name="subject" placeholder="Ex : SVT">
        </div>

        <div class="mb-4">
          <label for="school_year" class="vox-label">Année scolaire</label>
          <input type="text" class="vox-input" id="school_year" name="school_year" value="{{ default_year }}">
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('teacher_crud.classes') }}" class="btn vox-btn-outline">Annuler</a>
          <button type="submit" class="btn vox-btn-primary">Créer la classe</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
