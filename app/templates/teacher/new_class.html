{% extends "base.html" %}
{% set breadcrumbs = [{"label": "Classes", "url": "/teacher/classes"}, {"label": "Nouvelle classe", "url": None}] %}
{% block title %}Nouvelle classe — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="vox-card">
      <h2 class="h4 mb-4">Nouvelle classe</h2>
      
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
          <label for="name" class="vox-label">Nom de la classe *</label>
          <input type="text" class="vox-input" id="name" name="name" required placeholder="Ex: 3ème B">
        </div>

        <div class="mb-3">
          <label for="subject" class="vox-label">Matière</label>
          <input type="text" class="vox-input" id="subject" name="subject" placeholder="Ex: Mathématiques">
        </div>

        <div class="mb-4">
          <label for="school_year" class="vox-label">Année scolaire</label>
          <input type="text" class="vox-input" id="school_year" name="school_year" value="2025-2026">
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('teacher_crud.classes') }}" class="btn vox-btn-outline">Annuler</a>
          <button type="submit" class="btn vox-btn-primary">Créer la classe</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
