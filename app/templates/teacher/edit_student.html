{% extends "base.html" %}
{% block title %}Modifier élève — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="vox-card">
      <h2 class="h4 mb-4">Modifier l'élève</h2>
      <p class="text-muted small mb-3">Alias actuel : <span class="vox-badge">{{ student.alias }}</span></p>
      
      <form method="POST" action="{{ url_for('teacher_crud.edit_student', class_id=classroom_id, student_id=student.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="row g-3">
          <div class="col-6">
            <label class="vox-label">Prénom</label>
            <input type="text" name="first_name" class="vox-input" value="{{ first }}" required>
          </div>
          <div class="col-6">
            <label class="vox-label">Nom</label>
            <input type="text" name="last_name" class="vox-input" value="{{ last }}" required>
          </div>
        </div>
        <p class="text-muted small mt-3"><i class="bi bi-info-circle"></i> L'alias RGPD sera recalculé automatiquement.</p>

        <div class="d-flex justify-content-between mt-4">
          <a href="{{ url_for('teacher_crud.class_detail', class_id=classroom_id) }}" class="btn vox-btn-outline">Annuler</a>
          <button type="submit" class="btn vox-btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
