{% extends "base.html" %}
{% block title %}Modifier {{ classroom.name }} — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="vox-card">
      <h2 class="h4 mb-4">Modifier la classe</h2>
      
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
          <label for="name" class="vox-label">Nom de la classe *</label>
          <input type="text" class="vox-input" id="name" name="name" value="{{ classroom.name }}" required>
        </div>

        <div class="mb-3">
          <label for="level" class="vox-label">Niveau</label>
          <select class="vox-input" id="level" name="level">
            <option value="">-- Non renseigné --</option>
            {% for lvl in levels %}
              <option value="{{ lvl }}" {% if classroom.level == lvl %}selected{% endif %}>{{ lvl }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="subject" class="vox-label">Matière</label>
          <input type="text" class="vox-input" id="subject" name="subject" value="{{ classroom.subject or '' }}">
        </div>

        <div class="mb-4">
          <label for="school_year" class="vox-label">Année scolaire</label>
          <input type="text" class="vox-input" id="school_year" name="school_year" value="{{ classroom.school_year }}">
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('teacher_crud.class_detail', class_id=classroom.id) }}" class="btn vox-btn-outline">Annuler</a>
          <button type="submit" class="btn vox-btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
