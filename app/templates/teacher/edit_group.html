{% extends "base.html" %}
{% block title %}Modifier groupe {{ group.name }}{% endblock %}
{% block content %}
<div class="vox-page-hero mb-4">
  <h1>{{ group.name }}</h1>
  <p>{{ classroom.name }}</p>
</div>
<div class="vox-card">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="vox-label">Nom du groupe</label>
      <input type="text" name="name" class="vox-input" value="{{ group.name }}" required>
    </div>
    <div class="mb-4">
      <label class="vox-label">Élèves dans le groupe</label>
      <div style="max-height: 300px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem;">
        {% for s in students %}
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="student_ids" value="{{ s.id }}" id="student-{{ s.id }}"
            {% if s.id in members %}checked{% endif %}>
          <label class="form-check-label" for="student-{{ s.id }}">
            {{ s.alias }}
          </label>
        </div>
        {% endfor %}
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn vox-btn-primary">Enregistrer</button>
      <a href="/teacher/classes/{{ classroom.id }}" class="btn vox-btn-dark">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
