{% extends "base.html" %}
{% block title %}Modifier le groupe {{ group.name }} — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="vox-card">
      <h2 class="h4 mb-4">Modifier le groupe "{{ group.name }}"</h2>
      
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-4">
          <label class="vox-label">Nom du groupe</label>
          <input type="text" name="name" class="vox-input" value="{{ group.name }}" required>
        </div>

        <div class="mb-4">
          <label class="vox-label">Membres du groupe</label>
          <div class="border rounded p-3" style="max-height: 300px; overflow-y: auto;">
            {% for s in students %}
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="student_ids" value="{{ s.id }}" id="student_{{ s.id }}" {% if s.id in members %}checked{% endif %}>
                <label class="form-check-label" for="student_{{ s.id }}">
                  {{ s.display_last }}, {{ s.display_first }} <span class="text-muted small">({{ s.alias }})</span>
                </label>
              </div>
            {% endfor %}
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <a href="{{ url_for('teacher_crud.class_detail', class_id=classroom.id) }}" class="btn vox-btn-outline">Annuler</a>
          <button type="submit" class="btn vox-btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
