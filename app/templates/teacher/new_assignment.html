{% extends "base.html" %}
{% block title %}Nouveau devoir — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="vox-page-hero mb-4">
      <h1>Nouveau devoir</h1>
      <p>{{ classroom.name }} · {{ classroom.subject or '' }}</p>
    </div>

    <div class="vox-card">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label class="vox-label">Titre *</label>
          <input type="text" name="title" class="vox-input" placeholder="ex : Contrôle chapitre 3" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col">
            <label class="vox-label">Date</label>
            <input type="date" name="date" class="vox-input"
                   value="{{ now.strftime('%Y-%m-%d') if now else '' }}">
          </div>
          <div class="col">
            <label class="vox-label">Total points</label>
            <input type="number" name="total_points" class="vox-input" value="20" step="0.5">
          </div>
        </div>
        <div class="mb-4">
          <label class="vox-label">Description (optionnel)</label>
          <textarea name="description" class="vox-input" rows="2"></textarea>
        </div>

        <!-- Questions / Barème -->
        <div class="fw-bold mb-3">
          Barème par question
          <span class="text-muted fw-normal small ms-2">Mistral extraira les notes automatiquement.</span>
        </div>

        <div id="questions-list">
          <div class="question-row row g-2 mb-3 align-items-start">
            <div class="col-12 col-md-5">
              <input type="text" name="q_label" class="vox-input" placeholder="Libellé de la question" required>
            </div>
            <div class="col-12 col-md-2">
              <input type="number" name="q_max" class="vox-input" placeholder="Points" step="0.5" min="0" required>
            </div>
            <div class="col-12 col-md-4">
              <div class="comp-picker-wrapper position-relative">
                <button type="button" class="comp-btn vox-input text-start d-flex align-items-center gap-2"
                        onclick="toggleCompDropdown(this)">
                  <i class="bi bi-award"></i>
                  <span class="comp-label text-muted small">Compétence (optionnel)</span>
                  <i class="bi bi-chevron-down ms-auto small"></i>
                </button>
                <input type="hidden" name="q_competence_id" value="">
                <div class="comp-dropdown border rounded-3 bg-white shadow-sm"
                    style="display:none; position:absolute; z-index:200; width:100%; top:calc(100% + 4px);">
                  <input type="text" class="comp-search form-control border-0 border-bottom rounded-0"
                        placeholder="Rechercher…" oninput="filterCompDropdown(this)">
                  <div class="comp-list" style="max-height:240px; overflow-y:auto;"></div>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-1 text-end">
              <button type="button" class="btn btn-danger btn-sm remove-question" title="Supprimer cette question">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>

        <button type="button" id="add-question" class="btn vox-btn-dark btn-sm mb-4">
          <i class="bi bi-plus me-1"></i>Ajouter une question
        </button>

        <div class="d-flex gap-2">
          <button type="submit" class="btn vox-btn-primary">Créer le devoir</button>
          <a href="/teacher/classes/{{ classroom.id }}" class="btn vox-btn-dark">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const COMPETENCES_DATA = {{ competences_by_domain_json|safe }};

// ── Rendu de la liste des compétences pour une discipline ──────────────────
function buildCompList(listEl, subject, filter) {
  listEl.innerHTML = '';
  const comps = COMPETENCES_DATA[subject] || [];
  const f = (filter || '').toLowerCase().trim();
  const matched = comps.filter(c => !f || c.name.toLowerCase().includes(f));

  if (!matched.length) {
    listEl.innerHTML = '<div class="px-3 py-2 text-muted small">Aucune compétence trouvée.</div>';
    return;
  }

  matched.forEach(c => {
    const item = document.createElement('div');
    item.className = 'comp-item px-3 py-2 d-flex align-items-start gap-2';
    item.style.cursor = 'pointer';
    item.style.fontSize = '13px';
    item.style.lineHeight = '1.4';
    const badge = c.domain
      ? `<span class="badge bg-secondary bg-opacity-25 text-secondary flex-shrink-0">${c.domain}</span>`
      : '';
    item.innerHTML = `${badge}<span>${c.name}</span>`;
    item.addEventListener('mouseenter', () => item.classList.add('bg-light'));
    item.addEventListener('mouseleave', () => item.classList.remove('bg-light'));
    item.addEventListener('click', () => selectComp(item, c.id, c.name, subject, c.domain));
    listEl.appendChild(item);
  });
}

// ── Ouverture/fermeture du dropdown ───────────────────────────────────────
function toggleCompDropdown(btn) {
  document.querySelectorAll('.comp-dropdown').forEach(dd => {
    if (dd !== btn.closest('.comp-picker-wrapper').querySelector('.comp-dropdown')) {
      dd.style.display = 'none';
    }
  });
  const wrapper = btn.closest('.comp-picker-wrapper');
  const dd = wrapper.querySelector('.comp-dropdown');
  const isOpen = dd.style.display === 'block';
  if (isOpen) {
    dd.style.display = 'none';
  } else {
    showSubjectList(wrapper);
    dd.style.display = 'block';
  }
}

// ── Affiche la liste des disciplines ──────────────────────────────────────
function showSubjectList(wrapper) {
  const dd = wrapper.querySelector('.comp-dropdown');
  dd.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'px-3 pt-2 pb-1 text-muted fw-semibold';
  header.style.cssText = 'font-size:11px; letter-spacing:0.05em;';
  header.textContent = 'Choisir une discipline';
  dd.appendChild(header);

  Object.keys(COMPETENCES_DATA).forEach(subject => {
    const count = COMPETENCES_DATA[subject].length;
    const item = document.createElement('div');
    item.className = 'd-flex align-items-center justify-content-between px-3 py-2';
    item.style.cursor = 'pointer';
    item.style.fontSize = '14px';
    item.innerHTML = `
      <span>${subject}</span>
      <span class="badge bg-secondary bg-opacity-25 text-secondary">${count}</span>
    `;
    item.addEventListener('mouseenter', () => item.classList.add('bg-light'));
    item.addEventListener('mouseleave', () => item.classList.remove('bg-light'));
    item.addEventListener('click', () => showCompListForSubject(wrapper, subject));
    dd.appendChild(item);
  });
}

// ── Affiche les compétences d'une discipline ───────────────────────────────
function showCompListForSubject(wrapper, subject) {
  const dd = wrapper.querySelector('.comp-dropdown');
  dd.innerHTML = '';

  // Bouton retour
  const back = document.createElement('div');
  back.className = 'px-3 py-2 d-flex align-items-center gap-2 border-bottom';
  back.style.cursor = 'pointer';
  back.style.fontSize = '13px';
  back.innerHTML = '<i class="bi bi-arrow-left"></i> <span class="text-muted">' + subject + '</span>';
  back.addEventListener('click', () => showSubjectList(wrapper));
  dd.appendChild(back);

  // Champ recherche
  const search = document.createElement('input');
  search.type = 'text';
  search.className = 'form-control border-0 border-bottom rounded-0';
  search.placeholder = 'Rechercher…';
  search.style.fontSize = '13px';
  search.addEventListener('input', () => buildCompList(list, subject, search.value));
  dd.appendChild(search);

  // Liste
  const list = document.createElement('div');
  list.style.cssText = 'max-height:200px; overflow-y:auto;';
  dd.appendChild(list);
  buildCompList(list, subject, '');

  setTimeout(() => search.focus(), 50);
}

// ── Sélection d'une compétence ─────────────────────────────────────────────
function selectComp(item, compId, compName, subject, domain) {
  const wrapper = item.closest('.comp-picker-wrapper');
  const btn = wrapper.querySelector('.comp-btn');
  const hidden = wrapper.querySelector('input[name="q_competence_id"]');
  hidden.value = compId;

  const domainBadge = domain
    ? `<span class="badge bg-secondary bg-opacity-25 text-secondary me-1">${domain}</span>`
    : '';
  btn.querySelector('.comp-label').innerHTML =
    `${domainBadge}<span class="text-truncate">${compName}</span>
     <button type="button" class="comp-clear btn btn-sm p-0 ms-1 text-muted lh-1" 
             onclick="clearComp(event)" title="Retirer">&times;</button>`;
  btn.querySelector('.bi-chevron-down').style.display = 'none';
  wrapper.querySelector('.comp-dropdown').style.display = 'none';
}

// ── Réinitialisation ──────────────────────────────────────────────────────
function clearComp(event) {
  event.stopPropagation();
  const wrapper = event.target.closest('.comp-picker-wrapper');
  const btn = wrapper.querySelector('.comp-btn');
  btn.querySelector('.comp-label').innerHTML =
    `<span class="text-muted small">Compétence (optionnel)</span>`;
  btn.querySelector('.bi-chevron-down').style.display = '';
  wrapper.querySelector('input[name="q_competence_id"]').value = '';
}

// ── Ajout d'une question ──────────────────────────────────────────────────
document.getElementById('add-question').addEventListener('click', () => {
  const original = document.querySelector('.question-row');
  const newRow = original.cloneNode(true);
  newRow.querySelectorAll('input[type="text"], input[type="number"]').forEach(i => i.value = '');
  const btn = newRow.querySelector('.comp-btn');
  btn.querySelector('.comp-label').innerHTML =
    `<span class="text-muted small">Compétence (optionnel)</span>`;
  btn.querySelector('.bi-chevron-down').style.display = '';
  const clear = btn.querySelector('.comp-clear');
  if (clear) clear.remove();
  newRow.querySelector('input[name="q_competence_id"]').value = '';
  newRow.querySelector('.comp-dropdown').style.display = 'none';
  document.getElementById('questions-list').appendChild(newRow);
});

// ── Suppression + fermeture au clic extérieur ─────────────────────────────
document.addEventListener('click', e => {
  if (e.target.closest('.remove-question')) {
    const row = e.target.closest('.question-row');
    if (document.querySelectorAll('.question-row').length > 1) row.remove();
    else alert('Il doit y avoir au moins une question.');
  }
  if (!e.target.closest('.comp-picker-wrapper') && !e.target.closest('.comp-dropdown')) {
      document.querySelectorAll('.comp-dropdown').forEach(dd => dd.style.display = 'none');
  }
});
</script>
{% endblock %}
