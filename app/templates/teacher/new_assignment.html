{% extends "base.html" %}
{% block title %}Nouveau devoir — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="vox-page-hero mb-4">
      <h1>Nouveau devoir</h1>
      <p>{{ classroom.name }} · {{ classroom.subject or '' }}</p>
    </div>

    <div class="vox-card">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label class="vox-label">Titre *</label>
          <input type="text" name="title" class="vox-input" placeholder="ex : Contrôle chapitre 3" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col">
            <label class="vox-label">Date</label>
            <input type="date" name="date" class="vox-input"
                   value="{{ now.strftime('%Y-%m-%d') if now else '' }}">
          </div>
          <div class="col">
            <label class="vox-label">Total points</label>
            <input type="number" name="total_points" class="vox-input" value="20" step="0.5">
          </div>
        </div>
        <div class="mb-4">
          <label class="vox-label">Description (optionnel)</label>
          <textarea name="description" class="vox-input" rows="2"></textarea>
        </div>

        <!-- Questions / Barème -->
        <div class="fw-bold mb-3">
          Barème par question
          <span class="text-muted fw-normal small ms-2">Mistral extraira les notes automatiquement.</span>
        </div>

        <div id="questions-list">
          <div class="question-row row g-2 mb-3 align-items-start">
            <div class="col-12 col-md-5">
              <input type="text" name="q_label" class="vox-input" placeholder="Libellé de la question" required>
            </div>
            <div class="col-12 col-md-2">
              <input type="number" name="q_max" class="vox-input" placeholder="Points" step="0.5" min="0" required>
            </div>
            <div class="col-12 col-md-4">
              <div class="row g-1">
                <div class="col-6">
                  <select name="q_domain" class="vox-input domain-select" data-row-index="0">
                    <option value="">Domaine</option>
                    {% for domain, comps in competences_by_domain.items() %}
                    <option value="{{ domain }}">{{ domain }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-6">
                  <select name="q_competence_id" class="vox-input competence-select" data-row-index="0" disabled>
                    <option value="">Compétence</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="col-12 col-md-1 text-end">
              <button type="button" class="btn btn-danger btn-sm remove-question" title="Supprimer cette question">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>

        <button type="button" id="add-question" class="btn vox-btn-dark btn-sm mb-4">
          <i class="bi bi-plus me-1"></i>Ajouter une question
        </button>

        <div class="d-flex gap-2">
          <button type="submit" class="btn vox-btn-primary">Créer le devoir</button>
          <a href="/teacher/classes/{{ classroom.id }}" class="btn vox-btn-dark">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('add-question').addEventListener('click', () => {
    const row = document.querySelector('.question-row').cloneNode(true);
    row.querySelectorAll('input').forEach(i => i.value = '');
    document.getElementById('questions-list').appendChild(row);
  });
</script>
<script>
  // Données des compétences par domaine (injectées depuis Flask)
  const competencesData = {{ competences_by_domain_json|safe }};

  function populateCompetenceSelect(domainSelect, competenceSelect) {
    const selectedDomain = domainSelect.value;
    competenceSelect.innerHTML = '<option value="">Compétence</option>';
    competenceSelect.disabled = !selectedDomain;
    
    if (selectedDomain && competencesData[selectedDomain]) {
      competencesData[selectedDomain].forEach(comp => {
        const option = document.createElement('option');
        option.value = comp.id;
        option.textContent = comp.name;
        competenceSelect.appendChild(option);
      });
    }
  }

  // Initialiser les selects pour une nouvelle ligne
  function initRowSelects(row) {
    const domainSelect = row.querySelector('.domain-select');
    const competenceSelect = row.querySelector('.competence-select');
    
    domainSelect.addEventListener('change', () => populateCompetenceSelect(domainSelect, competenceSelect));
    
    // Si un domaine est déjà sélectionné (cas du clone), on le gère
    if (domainSelect.value) {
      populateCompetenceSelect(domainSelect, competenceSelect);
    }
  }

  // Ajouter une nouvelle ligne
  document.getElementById('add-question').addEventListener('click', () => {
    const originalRow = document.querySelector('.question-row');
    const newRow = originalRow.cloneNode(true);
    
    // Reset des valeurs
    newRow.querySelectorAll('input').forEach(i => i.value = '');
    const domainSelect = newRow.querySelector('.domain-select');
    const competenceSelect = newRow.querySelector('.competence-select');
    domainSelect.value = '';
    competenceSelect.innerHTML = '<option value="">Compétence</option>';
    competenceSelect.disabled = true;
    
    // Mettre à jour les index (optionnel)
    const newIndex = document.querySelectorAll('.question-row').length;
    domainSelect.dataset.rowIndex = newIndex;
    competenceSelect.dataset.rowIndex = newIndex;
    
    document.getElementById('questions-list').appendChild(newRow);
    initRowSelects(newRow);
  });

  // Initialiser les lignes existantes
  document.querySelectorAll('.question-row').forEach(row => initRowSelects(row));

  // Supprimer une ligne
  document.addEventListener('click', function(e) {
    if (e.target.closest('.remove-question')) {
      const row = e.target.closest('.question-row');
      if (document.querySelectorAll('.question-row').length > 1) {
        row.remove();
      } else {
        alert('Il doit y avoir au moins une question.');
      }
    }
  });
</script>
{% endblock %}
