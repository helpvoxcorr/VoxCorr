{% extends "base.html" %}
{% block title %}Changer mon mot de passe — VoxCorr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="vox-card">
      <h2 class="h4 mb-4">Changer mon mot de passe</h2>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="vox-label" for="current">Mot de passe actuel</label>
          <input type="password" id="current" name="current" class="vox-input" autocomplete="current-password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="vox-label" for="new_password">Nouveau mot de passe</label>
          <input type="password" id="new_password" name="new_password" class="vox-input" autocomplete="new-password" required>
          <div class="text-muted small mt-1">10 caractères min., majuscule, minuscule, chiffre et caractère spécial.</div>
        </div>
        <div class="mb-4">
          <label class="vox-label" for="confirm_password">Confirmer</label>
          <input type="password" id="confirm_password" name="confirm_password" class="vox-input" autocomplete="new-password" required>
        </div>
        <div class="d-flex justify-content-between">
          <a href="{{ url_for('teacher_admin.admin') }}" class="btn vox-btn-outline">Annuler</a>
          <button type="submit" class="btn vox-btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
