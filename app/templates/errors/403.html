{% extends "base.html" %}
{% block title %}Accès refusé — VoxCorr{% endblock %}
{% block page_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/errors.css') }}">{% endblock %}
{% block content %}
<div class="error-vc">
  <div class="error-vc-code">403</div>
  <h2 class="error-vc-title">Accès refusé</h2>
  <p class="error-vc-text">Vous n'avez pas les droits pour accéder à cette ressource.</p>
  <a href="{{ url_for('teacher_crud.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn-vc btn-vc-primary">Retour à l'accueil</a>
</div>
{% endblock %}
