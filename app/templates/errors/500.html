{% extends "base.html" %}
{% block title %}Erreur serveur — VoxCorr{% endblock %}
{% block page_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/errors.css') }}">{% endblock %}
{% block content %}
<div class="error-vc">
  <div class="error-vc-code">500</div>
  <h2 class="error-vc-title">Erreur interne</h2>
  <p class="error-vc-text">Quelque chose s'est mal passé de notre côté. L'incident a été enregistré.</p>
  <a href="{{ url_for('teacher_crud.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn-vc btn-vc-primary">Réessayer</a>
</div>
{% endblock %}
