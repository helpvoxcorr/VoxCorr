{% extends "base.html" %}
{% block title %}Trop de requêtes — VoxCorr{% endblock %}
{% block page_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/errors.css') }}">{% endblock %}
{% block content %}
<div class="error-vc">
  <div class="error-vc-code">429</div>
  <h2 class="error-vc-title">Trop de tentatives</h2>
  <p class="error-vc-text">Vous avez effectué trop de requêtes en peu de temps. Patientez quelques minutes.</p>
  <a href="{{ url_for('teacher_crud.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn-vc btn-vc-primary">Retour à l'accueil</a>
</div>
{% endblock %}
